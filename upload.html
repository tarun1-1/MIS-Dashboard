<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CarmaOne — MIS Upload</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap');
:root {
  --bg:#eef0fb; --bg2:#ffffff; --border:#d2d6ec;
  --text:#111428; --text2:#454a6b; --text3:#8f95b8;
  --indigo:#4353ff; --indigo-light:#eceeff;
  --violet:#7c3aed;
  --emerald:#059669; --emerald-light:#dcf5ed;
  --rose:#e11d48; --rose-light:#fde8ee;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sora',sans-serif;background:linear-gradient(140deg,#e8ebff 0%,#f3eeff 50%,#e0f4ff 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
.card{background:var(--bg2);border-radius:20px;padding:40px;width:100%;max-width:460px;box-shadow:0 8px 40px rgba(30,40,120,0.12);}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:32px;justify-content:center;}
.brand-mark{width:38px;height:38px;background:linear-gradient(135deg,var(--indigo),var(--violet));border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px;box-shadow:0 4px 16px rgba(67,83,255,0.35);}
.brand-name{font-size:20px;font-weight:700;color:var(--text);}
.title{font-size:22px;font-weight:300;color:var(--text);text-align:center;margin-bottom:6px;letter-spacing:-0.3px;}
.title strong{font-weight:700;}
.subtitle{font-size:12px;color:var(--text3);text-align:center;margin-bottom:28px;}
.drop-zone{border:2px dashed var(--border);border-radius:14px;padding:40px 24px;text-align:center;cursor:pointer;transition:all 0.2s;background:var(--bg);margin-bottom:20px;}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--indigo);background:var(--indigo-light);}
.drop-icon{font-size:32px;margin-bottom:12px;}
.drop-title{font-size:14px;font-weight:500;color:var(--text);margin-bottom:4px;}
.drop-sub{font-size:11px;color:var(--text3);}
.file-selected{font-size:12px;color:var(--indigo);font-weight:500;margin-bottom:16px;text-align:center;padding:8px 16px;background:var(--indigo-light);border-radius:8px;display:none;}
.upload-btn{width:100%;background:linear-gradient(135deg,var(--indigo),var(--violet));color:#fff;border:none;padding:14px;border-radius:10px;font-size:14px;font-family:'Sora',sans-serif;font-weight:600;cursor:pointer;transition:all 0.15s;box-shadow:0 4px 16px rgba(67,83,255,0.32);}
.upload-btn:hover{transform:translateY(-1px);}
.upload-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.status{margin-top:16px;padding:12px 16px;border-radius:10px;font-size:13px;font-weight:500;text-align:center;display:none;}
.status.success{background:var(--emerald-light);color:var(--emerald);}
.status.error{background:var(--rose-light);color:var(--rose);}
.status.loading{background:var(--indigo-light);color:var(--indigo);}
.dashboard-link{display:block;text-align:center;margin-top:20px;font-size:12px;color:var(--text3);text-decoration:none;}
.dashboard-link span{color:var(--indigo);font-weight:500;}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brand-mark">C</div>
    <div class="brand-name">CarmaOne</div>
  </div>
  <div class="title"><strong>MIS Data</strong> Upload</div>
  <div class="subtitle">Upload today's Excel file to update the dashboard for everyone</div>

  <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
    <div class="drop-icon">📊</div>
    <div class="drop-title">Drop Excel file here</div>
    <div class="drop-sub">or click to browse · .xlsx only</div>
  </div>

  <div class="file-selected" id="fileSelected">📎 <span id="fileName"></span></div>
  <input type="file" id="fileInput" accept=".xlsx" style="display:none" onchange="onFileSelect(this.files[0])">

  <button class="upload-btn" id="uploadBtn" onclick="uploadFile()" disabled>Upload & Update Dashboard</button>
  <div class="status" id="status"></div>

  <a href="https://tarun1-1.github.io/MIS-Dashboard/" class="dashboard-link" target="_blank">
    View dashboard → <span>tarun1-1.github.io/MIS-Dashboard</span>
  </a>
</div>

<script>
const BACKEND = 'https://mis-backend-python.onrender.com/upload';
let selectedFile = null;

const dz = document.getElementById('dropZone');
dz.addEventListener('dragover', e=>{e.preventDefault();dz.classList.add('drag-over');});
dz.addEventListener('dragleave', ()=>dz.classList.remove('drag-over'));
dz.addEventListener('drop', e=>{
  e.preventDefault(); dz.classList.remove('drag-over');
  if(e.dataTransfer.files[0]) onFileSelect(e.dataTransfer.files[0]);
});

function onFileSelect(file) {
  if(!file.name.endsWith('.xlsx')) { showStatus('Only .xlsx files are allowed','error'); return; }
  selectedFile = file;
  document.getElementById('fileName').textContent = file.name;
  document.getElementById('fileSelected').style.display = 'block';
  document.getElementById('uploadBtn').disabled = false;
  hideStatus();
}

async function uploadFile() {
  if(!selectedFile) return;
  const btn = document.getElementById('uploadBtn');
  btn.disabled = true;
  btn.textContent = 'Uploading...';
  showStatus('Uploading file, please wait...','loading');
  const formData = new FormData();
  formData.append('file', selectedFile);
  try {
    const res = await fetch(BACKEND, {method:'POST', body:formData});
    const data = await res.json();
    if(res.ok && data.success) {
      showStatus('✓ File uploaded successfully! Dashboard is now updated for everyone.','success');
      btn.textContent = '✓ Uploaded Successfully';
      document.getElementById('fileSelected').style.display = 'none';
      selectedFile = null;
    } else { throw new Error(data.error || 'Upload failed'); }
  } catch(e) {
    showStatus('✗ Upload failed: ' + e.message,'error');
    btn.disabled = false;
    btn.textContent = 'Upload & Update Dashboard';
  }
}

function showStatus(msg, type) {
  const s = document.getElementById('status');
  s.textContent = msg; s.className = 'status ' + type; s.style.display = 'block';
}
function hideStatus() { document.getElementById('status').style.display = 'none'; }
</script>
</body>
</html>
