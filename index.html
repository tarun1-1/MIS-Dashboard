<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CarmaOne — AI Sales Tele Calling MIS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
:root {
  --bg:#eef0fb; --bg2:#ffffff; --bg3:#e4e7f5;
  --border:#d2d6ec; --border2:#bcc2e0;
  --text:#111428; --text2:#454a6b; --text3:#8f95b8;
  --indigo:#4353ff; --indigo-light:#eceeff; --indigo-mid:#b8bdff;
  --violet:#7c3aed; --violet-light:#f0ebff;
  --teal:#0891b2; --teal-light:#ddf4fa;
  --emerald:#059669; --emerald-light:#dcf5ed;
  --amber:#d97706; --amber-light:#fef3c7;
  --rose:#e11d48; --rose-light:#fde8ee;
  --coral:#f97316; --coral-light:#fff0e6;
  --shadow:0 1px 4px rgba(30,40,120,0.07),0 4px 20px rgba(30,40,120,0.05);
  --shadow-lg:0 6px 32px rgba(30,40,120,0.13);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased;}
#loadingScreen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:linear-gradient(140deg,#e8ebff 0%,#f3eeff 50%,#e0f4ff 100%);}
.spinner{width:40px;height:40px;border:3px solid var(--indigo-light);border-top-color:var(--indigo);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-brand{display:flex;align-items:center;gap:10px;}
.brand-mark-lg{width:44px;height:44px;background:linear-gradient(135deg,var(--indigo),var(--violet));border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px;box-shadow:0 4px 16px rgba(67,83,255,0.35);}
.brand-name-lg{font-size:24px;font-weight:700;color:var(--text);}
.loading-text{font-size:13px;color:var(--text3);}
.upload-cta{background:linear-gradient(135deg,var(--indigo),var(--violet));color:#fff;border:none;padding:11px 28px;border-radius:9px;font-size:13px;font-family:'Sora',sans-serif;font-weight:600;cursor:pointer;}
#dashboard{display:none;}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(30,40,120,0.06);}
.topbar-brand{display:flex;align-items:center;gap:10px;}
.tb-mark{width:28px;height:28px;background:linear-gradient(135deg,var(--indigo),var(--violet));border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;}
.tb-name{font-size:14px;font-weight:700;color:var(--text);}
.tb-divider{width:1px;height:18px;background:var(--border2);margin:0 14px;}
.tb-title{font-size:13px;color:var(--text2);}
.view-tabs{display:flex;background:var(--bg3);border-radius:8px;padding:3px;gap:2px;}
.view-tab{padding:6px 18px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;color:var(--text2);border:none;background:none;font-family:'Sora',sans-serif;transition:all 0.15s;}
.view-tab.active{background:var(--bg2);color:var(--indigo);box-shadow:0 1px 4px rgba(30,40,120,0.1);}
.topbar-right{display:flex;align-items:center;gap:10px;}
.tb-btn{font-size:12px;color:var(--text2);background:none;border:1px solid var(--border2);border-radius:7px;padding:6px 14px;cursor:pointer;font-family:'Sora',sans-serif;transition:all 0.15s;}
.tb-btn:hover{color:var(--indigo);border-color:var(--indigo);}
.tb-btn.danger{color:var(--rose);border-color:var(--rose);}
.last-updated{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace;background:var(--bg3);padding:5px 10px;border-radius:6px;}
.content{padding:28px 32px;max-width:1440px;margin:0 auto;}
.view-panel{display:none;animation:fadeIn 0.25s ease;}
.view-panel.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.period-toggle{display:flex;gap:8px;margin-bottom:28px;flex-wrap:wrap;}
.ptab{padding:7px 18px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border2);background:var(--bg2);color:var(--text2);font-family:'Sora',sans-serif;transition:all 0.15s;}
.ptab.active{background:linear-gradient(135deg,var(--indigo),var(--violet));color:#fff;border-color:transparent;box-shadow:0 3px 12px rgba(67,83,255,0.28);}
.stage-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;margin-top:32px;}
.stage-pill{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:4px 12px;border-radius:20px;}

.sp-tele{background:var(--emerald-light);color:var(--emerald);}

.mc.t-teal{border-top-color:var(--teal);}.mc.t-emerald{border-top-color:var(--emerald);}

.p-indigo{color:var(--indigo);}.p-violet{color:var(--violet);}.p-teal{color:var(--teal);}

.month-section{background:var(--bg2);border:1px solid var(--border);border-radius:14px;margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow);}

.dw-table td:first-child{text-align:left;font-family:'Sora',sans-serif;color:var(--text2);font-weight:500;}

<body>

<div id="loadingScreen">
  <div class="loading-brand">
    <div class="brand-mark-lg">C</div>
    <div class="brand-name-lg">CarmaOne</div>
  </div>
  <div class="spinner"></div>
  <div class="loading-text">Connecting to server...</div>
  <div id="errorBox" style="display:none;flex-direction:column;align-items:center;gap:14px;padding:28px 32px;background:var(--bg2);border:1px solid var(--border);border-radius:16px;max-width:420px;text-align:center;">
    <div style="font-size:32px;">☕</div>
    <div style="font-size:14px;font-weight:600;color:var(--text);">Dashboard is loading</div>
    <div style="font-size:12px;color:var(--text3);line-height:1.7;">The server is starting up. Please wait 30 seconds and click refresh.</div>
    <button class="upload-cta" onclick="fetchData()">↺ Try again</button>
  </div>
</div>

<div id="dashboard">
  <div class="topbar">
    <div class="topbar-brand">
      <div class="tb-mark">C</div>
      <div class="tb-name">CarmaOne</div>
      <div class="tb-divider"></div>
      <div class="tb-title">AI Sales Tele Calling MIS</div>
    </div>
    <div class="view-tabs">
      <button class="view-tab active" onclick="switchView('main',this)">Dashboard</button>
      <button class="view-tab" onclick="switchView('daywise',this)">Day-wise View</button>
      <button class="view-tab" onclick="switchView('audit',this);loadAudit()">Audit Trail</button>
    </div>
    <div class="topbar-right">
      <div class="last-updated" id="lastUpdated">—</div>
      <span id="freshDot" style="width:8px;height:8px;border-radius:50%;background:#ccc;display:inline-block;margin-left:2px;"></span>
      <button class="tb-btn" onclick="fetchData()">↺ Refresh</button>
      <button class="tb-btn danger" onclick="window.open('upload.html','_blank')">↑ New file</button>
    </div>
  </div>
  <div class="content">
    <div id="view-main"  class="view-panel active"></div>
    <div id="view-daywise" class="view-panel"></div>
    <div id="view-audit"   class="view-panel"></div>
  </div>
</div>

<script>
const API = 'https://mis-backend-python.onrender.com/data';
let G = null, loadT2;
let s3SrcFilter = 'all', s3Mode = 'count';
let auditLoaded = false;

window.addEventListener('load', fetchData);

function setLoadingMsg(m) { document.querySelector('.loading-text').textContent = m; }

async function fetchWithRetry(url, retries=4) {
  for (let i=0; i<retries; i++) {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 15000);
      const res = await fetch(url, {signal: ctrl.signal});
      clearTimeout(t);
      if (!res.ok) throw new Error('Bad response');
      const lu = res.headers.get('Last-Updated');
      if (lu) document.getElementById('lastUpdated').textContent = 'Last uploaded: ' + lu;
      return await res.json();
    } catch(e) {
      if (i < retries-1) {
        setLoadingMsg('Server waking up... attempt ' + (i+2) + ' of ' + retries);
        await new Promise(r => setTimeout(r, 3000 + i*2000));
      }
    }
  }
  throw new Error('All retries failed');
}

async function fetchData() {
  document.getElementById('loadingScreen').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('errorBox').style.display = 'none';
  setLoadingMsg('Connecting to server...');
  clearTimeout(loadT2);
  loadT2 = setTimeout(() => setLoadingMsg('Waking server, please wait...'), 4000);
  try {
    const data = await fetchWithRetry(API + '?t=' + Date.now(), 4);
    clearTimeout(loadT2);
    G = data;
    try { localStorage.setItem('carmaone_mis', JSON.stringify(data)); } catch(e) {}
    showDashboard();
  } catch(err) {
    clearTimeout(loadT2);
    const cached = localStorage.getItem('carmaone_mis');
    if (cached) {
      try { G = JSON.parse(cached); setTimeout(showDashboard, 400); return; } catch(e) {}
    }
    setLoadingMsg('Server is starting up — please wait...');
    setTimeout(() => document.getElementById('errorBox').style.display='flex', 3000);
    setTimeout(() => { document.getElementById('errorBox').style.display='none'; fetchData(); }, 35000);
  }
}

function showDashboard() {
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  const ts = G.generated || '';
  if (ts) document.getElementById('lastUpdated').textContent = 'Last uploaded: ' + ts;
  const dot = document.getElementById('freshDot');
  const todayD = new Date().getDate();
  dot.style.background = (ts && ts.includes(' '+todayD+' ')) ? '#059669' : '#e11d48';
  renderMain('mtd');
  renderDaywise();
}

// ── UTILS ──
const fmt  = n => (parseInt(n)||0).toLocaleString('en-IN');
const fmtD = n => (parseFloat(n)||0).toFixed(1)+'%';
const pct  = (n,d) => (!d||d===0)?'—':((n/d)*100).toFixed(1)+'%';
const pctN = (n,d) => (!d||d===0)?0:(n/d)*100;

function fmtSec(sec) {
  if (!sec || sec===0) return '—';
  sec = Math.round(sec);
  if (sec<60) return sec+'s';
  const m=Math.floor(sec/60), s=sec%60;
  if (m<60) return m+'m'+(s?' '+s+'s':'');
  return Math.floor(m/60)+'h '+(m%60)+'m';
}
function fmtAmt(cr) {
  if (!cr || cr===0) return '—';
  if (cr<1) return '₹'+Math.round(cr*100)+'L';
  return '₹'+cr.toFixed(1)+'Cr';
}
function cleanAgent(name) {
  return (name||'Unknown').replace(/_Jarvis$/i,'').replace(/_/g,' ')
    .split(' ').map(w=>w?w[0].toUpperCase()+w.slice(1).toLowerCase():'').join(' ').trim();
}

function renderMain(which) {
  const a        = which==='mtd' ? G.ai?.mtd              : G.ai?.lastDay;
  const h        = which==='mtd' ? G.handoff?.mtd         : G.handoff?.lastDay;
  const blended  = which==='mtd' ? G.dialerBlended?.mtd   : G.dialerBlended?.lastDay;
  const dm       = which==='mtd' ? G.dialerManual?.mtd    : G.dialerManual?.lastDay;
  const rows     = G.pipeline?.rows || [];
  const lastLabel   = G.ai?.lastDay?.label || 'Last Day';
  const notDialled     = G.handoffNotDialled || 0;
  // MTD: true unique from set; Last Day: day-specific row count from handoff sheet
  const handoffUnique  = which==='mtd'
    ? (G.totalHandoffUnique||0)
    : ((h?.interested||0)+(h?.callback||0));
  // MTD: use cumulative totals; Last Day: use per-day unique counts
  const totalUnique = which==='mtd' ? (G.totalUniqueLeads||0)   : (a?.unique_leads||0);
  const blenUnique  = which==='mtd' ? (G.totalBlenUnique||0)    : (blended?.unique_leads||0);
  const manUnique   = which==='mtd' ? (G.totalManualUnique||0)  : (dm?.unique_leads||0);

  document.getElementById('view-main').innerHTML = `
    ${renderChain(a, h, blended, dm, rows, totalUnique, manUnique, handoffUnique)}
    <div class="period-toggle">
      <button class="ptab ${which==='mtd'?'active':''}" onclick="renderMain('mtd')">📅 MTD</button>
      <button class="ptab ${which==='last'?'active':''}" onclick="renderMain('last')">📆 ${lastLabel}</button>
    </div>
    ${renderS1(a, which, totalUnique)}
    ${renderStage2A(blended, notDialled, handoffUnique, blenUnique)}
    ${renderStage2B(dm, manUnique)}
    ${renderS3HTML(rows)}
    <div class="dash-footer">
      <span>CarmaOne — AI Sales Tele Calling MIS &nbsp;·&nbsp; Confidential</span>
      <span>Generated ${new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}</span>
    </div>`;
}

function renderExecStrip(a, h, blended, dm, rows, totalUnique, blenUnique, manUnique) {
  if (!a) return '';
  const aiInt    = a.dispositions?.['INTERESTED']?.dials||0;
  const aiCB     = a.dispositions?.['CALL BACK']?.dials||0;
  const handoff  = h ? (h.interested||0)+(h.callback||0) : 0;
  const bDials   = blended?.total_dials||0, bConn = blended?.connected||0;
  const bInt     = blended?.dispositions?.['Interested']||0;
  const bCB      = blended?.dispositions?.['Call Back']||blended?.dispositions?.['CALL BACK']||0;
  const dmDials  = dm?.total_dials||0, dmConn = dm?.connected||0;
  const dmInt    = dm?.dispositions?.['Interested']||0;
  const dmCB     = dm?.dispositions?.['Call Back']||0;
  const disbRows = rows.filter(r=>r.status==='Disbursed');
  const sanRows  = rows.filter(r=>r.status==='Sanctioned');
  const disbAmt  = disbRows.reduce((s,r)=>s+(r.expected_amount_cr||0),0);
  const sanAmt   = sanRows.reduce((s,r)=>s+(r.expected_amount_cr||0),0);
  const totalAmt = rows.reduce((s,r)=>s+(r.expected_amount_cr||0),0);
  const inProg   = rows.filter(r=>['Login Pending','Login','Hold','Credit Review'].includes(r.status)).length;
  const nmc      = (a.dispositions?.['NO MEANINGFUL CONTACT']?.connects||0)+(a.dispositions?.['NO MEANINGFUL CONVERSATION']?.connects||0);

  function ei(label, val, sub, color) {
    return '<div class="exec-item">'
      + '<div class="exec-item-label">' + label + '</div>'
      + '<div class="exec-item-val" style="' + (color?'color:'+color+';':'') + '">' + val + '</div>'
      + (sub ? '<div class="exec-item-sub">' + sub + '</div>' : '')
      + '</div>';
  }
  function eg(label, items) {
    return '<div class="exec-group"><div class="exec-group-label">' + label + '</div><div class="exec-items">' + items + '</div></div>';
  }

  return '<div class="exec-strip">'
    + eg('AI Auto-Calling',
        ei('Unique Leads', fmt(totalUnique), 'True unique')
      + ei('Total Dials',  fmt(a.total_dials), pct(a.connected,a.total_dials)+' conn.')
      + ei('Connected',    fmt(a.connected), '', 'var(--emerald)')
      + ei('Interested',   fmt(aiInt), pct(aiInt,a.connected)+' of conn.', 'var(--emerald)')
      + ei('Callback',     fmt(aiCB),  pct(aiCB,a.connected)+' of conn.',  'var(--violet)')
      + ei('NMC Rate',     fmtD(pctN(nmc,a.connected)), 'No conv. / conn.')
    )
    + eg('AI Handoff Tele',
        ei('Unique',     fmt(blenUnique||handoff), 'Handed off', 'var(--indigo)')
      + ei('Total Dials', fmt(bDials), pct(bConn,bDials)+' conn.')
      + ei('Connected',   fmt(bConn), '', 'var(--teal)')
      + ei('Interested',  fmt(bInt),  pct(bInt,bConn)+' of conn.', 'var(--emerald)')
      + ei('Callback',    fmt(bCB),   pct(bCB,bConn)+' of conn.',  'var(--violet)')
    )
    + eg('Direct Tele',
        ei('Unique',     fmt(manUnique||0), 'Unique CIDs', 'var(--indigo)')
      + ei('Total Dials', fmt(dmDials), pct(dmConn,dmDials)+' conn.')
      + ei('Connected',   fmt(dmConn), '', 'var(--teal)')
      + ei('Interested',  fmt(dmInt),  pct(dmInt,dmConn)+' of conn.', 'var(--emerald)')
      + ei('Callback',    fmt(dmCB),   pct(dmCB,dmConn)+' of conn.',  'var(--violet)')
    )
    + eg('Loan Pipeline',
        ei('Total',       fmt(rows.length), 'entries')
      + ei('In Progress', fmt(inProg), 'Login/Hold/Review', 'var(--amber)')
      + ei('Sanctioned',  fmt(sanRows.length), sanAmt>0?fmtAmt(sanAmt):'', 'var(--indigo)')
      + ei('Disbursed',   fmt(disbRows.length), disbAmt>0?fmtAmt(disbAmt):'', 'var(--emerald)')
      + ei('Pipeline \u20b9', fmtAmt(totalAmt), 'total expected')
    )
    + '</div>';
}





// ── STAGE 1 HELPERS ──
function s1DispRow(d, s, maxDials, totalDials, compact) {
  if (!s) return '';
  var m = DISPO_META[d] || ['#6b7280','#f3f4f6'];
  var barW = maxDials > 0 ? Math.min(100, s.dials / maxDials * 100) : 0;
  var pad  = compact ? '4px 10px' : '6px 10px';
  var fsz  = compact ? '10px' : '11px';
  var op   = compact ? 'opacity:0.82;' : '';
  return '<tr style="border-bottom:1px solid var(--border);' + op + '">'
    + '<td style="padding:' + pad + ';width:200px;"><span style="color:' + m[0] + ';background:' + m[1] + ';padding:2px 7px;border-radius:8px;font-size:' + fsz + ';font-weight:600;white-space:nowrap;">' + d + '</span></td>'
    + '<td style="padding:' + pad + ';width:90px;vertical-align:middle;"><div style="background:var(--bg3);border-radius:3px;height:4px;overflow:hidden;"><div style="width:' + barW.toFixed(0) + '%;height:4px;background:' + m[0] + ';border-radius:3px;opacity:0.7;"></div></div></td>'
    + '<td style="padding:' + pad + ';text-align:right;font-weight:600;font-size:' + fsz + ';">' + fmt(s.dials) + '</td>'
    + '<td style="padding:' + pad + ';text-align:right;color:var(--text3);font-size:10px;">' + pct(s.dials, totalDials) + '</td>'
    + '<td style="padding:' + pad + ';text-align:right;font-family:\'JetBrains Mono\',monospace;font-size:10px;color:var(--text3);">' + fmtSec(s.aht_sec) + '</td>'
    + '</tr>';
}

function s1CatHdr(label, color) {
  return '<tr><td colspan="5" style="padding:5px 10px 3px;font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:' + color + ';background:var(--bg3);border-top:1px solid var(--border);">' + label + '</td></tr>';
}

// ── STAGE 1: AI AUTO-CALLING ──
function renderS1(a, period, totalUnique) {
  if (!a) return '<div style="padding:30px;text-align:center;color:var(--text3);">No AI data for this period</div>';

  var dispos = Object.assign({}, a.dispositions || {});
  var nmc    = dispos['NO MEANINGFUL CONTACT']      || {dials:0,connects:0,talk_time_sec:0,aht_sec:0};
  var nmconv = dispos['NO MEANINGFUL CONVERSATION'] || {dials:0,connects:0,talk_time_sec:0,aht_sec:0};
  if (nmc.dials > 0 || nmconv.dials > 0) {
    var tot2 = nmc.dials + nmconv.dials;
    var conn2= nmc.connects + nmconv.connects;
    var tt2  = nmc.talk_time_sec + nmconv.talk_time_sec;
    dispos['NO MEANINGFUL CONNECT'] = {dials:tot2, connects:conn2, talk_time_sec:tt2, aht_sec: conn2>0 ? tt2/conn2 : 0};
    delete dispos['NO MEANINGFUL CONTACT'];
    delete dispos['NO MEANINGFUL CONVERSATION'];
  }

  var prod     = (dispos['INTERESTED'] ? dispos['INTERESTED'].dials : 0) + (dispos['CALL BACK'] ? dispos['CALL BACK'].dials : 0);
  var nmcConn  = dispos['NO MEANINGFUL CONNECT'] ? dispos['NO MEANINGFUL CONNECT'].connects : 0;
  var notReach = (dispos['NO ANSWER'] ? dispos['NO ANSWER'].dials : 0)
               + (dispos['NUMBER BUSY'] ? dispos['NUMBER BUSY'].dials : 0)
               + (dispos['SWITCHED OFF'] ? dispos['SWITCHED OFF'].dials : 0);
  var vals     = Object.values(dispos).map(function(s){return s.dials;});
  var maxDials = vals.length > 0 ? Math.max.apply(null, vals) : 1;
  var tot      = a.total_dials;

  var PROD_D = ['INTERESTED','CALL BACK'];
  var CONN_D = ['PITCH INCOMPLETE','NOT INTERESTED','NO MEANINGFUL CONNECT','WRONG NUMBER','DO NOT CALL','NOT ELIGIBLE'];
  var NCON_D = ['NO ANSWER','NUMBER BUSY','SWITCHED OFF','DUPLICATE LEAD','BLANK'];
  var known  = PROD_D.concat(CONN_D).concat(NCON_D);
  var others = Object.keys(dispos).filter(function(d){ return known.indexOf(d) < 0; });

  var tbl = '';
  tbl += s1CatHdr('Productive &mdash; to Tele Team', 'var(--emerald)');
  PROD_D.forEach(function(d){ tbl += s1DispRow(d, dispos[d], maxDials, tot, false); });
  tbl += s1CatHdr('Connected &mdash; Not Productive', 'var(--indigo)');
  CONN_D.forEach(function(d){ tbl += s1DispRow(d, dispos[d], maxDials, tot, false); });
  tbl += s1CatHdr('Not Connected', 'var(--text3)');
  NCON_D.forEach(function(d){ tbl += s1DispRow(d, dispos[d], maxDials, tot, true); });
  others.forEach(function(d){ tbl += s1DispRow(d, dispos[d], maxDials, tot, false); });

  var uCard  = period !== 'mtd'
    ? '<div class="mc"><div class="mc-lbl">Unique Leads</div><div class="mc-val">' + fmt(a.unique_leads) + '</div><div class="mc-sub">In this batch</div></div>'
    : '<div class="mc t-indigo"><div class="mc-lbl">Unique Leads (MTD)</div><div class="mc-val">' + fmt(totalUnique) + '</div><div class="mc-sub">True unique across all dates</div></div>';

  return '<div class="stage-header" style="margin-top:0;">'
    + '<div class="stage-pill sp-ai">Stage 1</div>'
    + '<div class="stage-title">AI Auto-Calling</div>'
    + '<div class="stage-sub">' + fmt(tot) + ' total dials</div>'
    + '</div>'
    + '<div class="metric-grid g4" style="margin-bottom:10px;">'
    + uCard
    + '<div class="mc"><div class="mc-lbl">Total Dials</div><div class="mc-val">' + fmt(tot) + '</div><div class="mc-sub">Auto-dial attempts</div></div>'
    + '<div class="mc t-emerald"><div class="mc-lbl">AI Connected</div><div class="mc-val">' + fmt(a.connected) + '</div><div class="mc-pct p-emerald">' + pct(a.connected,tot) + ' connect rate</div></div>'
    + '<div class="mc t-indigo"><div class="mc-lbl">AI Productive</div><div class="mc-val">' + fmt(prod) + '</div><div class="mc-pct p-indigo">' + pct(prod,a.connected) + ' of connected</div></div>'
    + '</div>'
    + '<div class="metric-grid g3" style="margin-bottom:14px;">'
    + '<div class="mc t-violet"><div class="mc-lbl">No Conversation Rate</div><div class="mc-val">' + fmtD(pctN(nmcConn,a.connected)) + '</div><div class="mc-sub">NMC of connected</div></div>'
    + '<div class="mc t-gray"><div class="mc-lbl">Not Reachable Rate</div><div class="mc-val">' + fmtD(pctN(notReach,tot)) + '</div><div class="mc-sub">No ans + busy + switched off</div></div>'
    + '</div>'
    + '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;">'
    + '<table style="width:100%;border-collapse:collapse;">'
    + '<thead><tr style="background:var(--bg3);">'
    + '<th class="th-cell" style="text-align:left;width:200px;">Disposition</th>'
    + '<th class="th-cell" style="width:90px;">Volume</th>'
    + thCell('Dials') + thCell('% of Total') + thCell('Avg Talk')
    + '</tr></thead>'
    + '<tbody>' + tbl + '</tbody>'
    + '</table></div>';
}

// ── STAGE 2A: HANDOFF ──
function renderStage2A(blended, notDialled, handoffUnique, blenUnique) {
  const total2A   = handoffUnique || 0;
  const bDials    = blended?.total_dials||0;
  const bConn     = blended?.connected||0;
  const bInt      = blended?.dispositions?.['Interested']||0;
  const bCB       = blended?.dispositions?.['Call Back']||blended?.dispositions?.['CALL BACK']||0;
  const bProd     = bInt + bCB;
  const subH      = 'padding:8px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;background:var(--bg3);border-bottom:1px solid var(--border);border-top:1px solid var(--border);color:var(--text2);';
  const noData    = !blended || bDials === 0;

  // Disposition rows
  const dispRows2A = Object.entries(blended?.dispositions||{}).sort(([,a],[,b])=>b-a)
    .map(([d,cnt])=>`<tr style="border-bottom:1px solid var(--border);">
      <td style="padding:6px 12px;width:140px;">${dispoBadge(d)}</td>
      <td style="padding:6px 12px;text-align:right;font-weight:600;font-size:11px;">${fmt(cnt)}</td>
      <td style="padding:6px 12px;text-align:right;color:var(--text3);font-size:10px;">${pct(cnt,bConn)}</td>
    </tr>`).join('') || noneRow(3);

  // Agent rows
  const agRows2A = Object.entries(blended?.agents||{}).filter(([ag])=>ag&&ag!=='Unknown').sort(([,a],[,b])=>b.dials-a.dials)
    .map(([ag,s])=>{
      const i=s.dispositions?.['Interested']||0, cb=s.dispositions?.['Call Back']||s.dispositions?.['CALL BACK']||0;
      return `<tr style="border-bottom:1px solid var(--border);">
        <td style="padding:5px 10px;font-weight:500;font-size:11px;">${cleanAgent(ag)}</td>
        <td style="padding:5px 10px;text-align:right;font-size:11px;">${fmt(s.dials)}</td>
        <td style="padding:5px 10px;text-align:right;color:var(--teal);font-size:11px;">${fmt(s.connected)}</td>
        <td style="padding:5px 10px;text-align:right;color:var(--text3);font-size:10px;">${pct(s.connected,s.dials)}</td>
        <td style="padding:5px 10px;text-align:right;color:var(--emerald);font-weight:600;font-size:11px;">${fmt(i)}</td>
        <td style="padding:5px 10px;text-align:right;color:var(--violet);font-size:11px;">${fmt(cb)}</td>
        <td style="padding:5px 10px;text-align:right;color:var(--indigo);font-weight:600;font-size:11px;">${fmt(i+cb)}</td>
        <td style="padding:5px 10px;text-align:right;color:var(--text3);font-size:10px;">${pct(i+cb,s.dials)}</td>
      </tr>`;}).join('') || noneRow(9);

  const flagHtml = notDialled > 0
    ? `<div style="display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--bg-warning);border-top:1px solid var(--border-warning);">
        <span style="font-size:12px;color:var(--text-warning);">⚠</span>
        <span style="font-size:11px;color:var(--text-warning);">${fmt(notDialled)} of ${fmt(total2A)} handoff leads not yet dialled by tele team</span>
       </div>` : '';

  const noDataNote = noData
    ? `<div style="padding:12px 14px;font-size:11px;color:var(--text3);background:var(--bg3);border-top:1px solid var(--border);">No blended call data yet — re-upload Dialer_Dump after deploying app update</div>` : '';

  return `
    <div class="stage-header">
      <div class="stage-pill" style="background:#EEEDFE;color:#534AB7;">Stage 2A</div>
      <div class="stage-title">AI Handoff Tele</div>
      <div class="stage-sub">Blended calls · matched by mobile</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px;">
      <div class="mc t-indigo"><div class="mc-lbl">Unique Leads</div><div class="mc-val" style="color:var(--indigo);">${fmt(bConn>0?blenUnique||0:0)}</div><div class="mc-sub">${bConn>0?'Actually dialled by tele':'Awaiting dialler data'}</div></div>
      <div class="mc"><div class="mc-lbl">Total Dials</div><div class="mc-val">${fmt(bDials)}</div><div class="mc-sub">${bDials>0?fmtD(bDials/Math.max(blenUnique||1,1))+' dials/lead':'awaiting data'}</div></div>
      <div class="mc t-emerald"><div class="mc-lbl">Connected</div><div class="mc-val" style="color:var(--teal);">${fmt(bConn)}</div><div class="mc-pct p-emerald">${pct(bConn,bDials)} connect rate</div></div>
      <div class="mc t-violet"><div class="mc-lbl">Productive</div><div class="mc-val" style="color:var(--violet);">${fmt(bProd)}</div><div class="mc-pct" style="color:var(--violet);">Int ${fmt(bInt)} · CB ${fmt(bCB)}</div></div>
    </div>
    ${flagHtml}${noDataNote}
    <div style="border-top:1px solid var(--border);padding:6px 12px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text3);background:var(--bg3);">Disposition Breakdown</div>
    <table style="width:100%;border-collapse:collapse;">
      <thead><tr style="background:var(--bg3);">
        <th class="th-cell" style="text-align:left;width:140px;">Disposition</th>${thCell('Count')}${thCell('% of conn.')}
      </tr></thead>
      <tbody>${dispRows2A}</tbody>
    </table>
    <div style="border-top:1px solid var(--border);padding:6px 12px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text3);background:var(--bg3);">Agent Performance</div>
    <div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:11px;">
      <thead><tr style="background:var(--bg3);">
        <th class="th-cell" style="text-align:left;">Agent</th>${thCell('Dials')}${thCell('Conn.')}${thCell('Cn%')}${thCell('Int.')}${thCell('CB')}${thCell('Prod')}${thCell('Pd%')}
      </tr></thead>
      <tbody>${agRows2A}</tbody>
    </table></div>`;
}

function renderStage2B(dm, totalManualUnique) {
  const dmDials = dm?.total_dials||0, dmConn = dm?.connected||0;
  const dmInt   = dm?.dispositions?.['Interested']||0;
  const dmCB    = dm?.dispositions?.['Call Back']||0;
  const dmProd  = dmInt + dmCB;
  const subH    = 'padding:8px 12px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text3);background:var(--bg3);border-top:1px solid var(--border);border-bottom:1px solid var(--border);';

  const disp2B = Object.entries(dm?.dispositions||{}).sort(([,a],[,b])=>b-a)
    .map(([d,cnt])=>`<tr style="border-bottom:1px solid var(--border);">
      <td style="padding:5px 10px;width:140px;">${dispoBadge(d)}</td>
      <td style="padding:5px 10px;text-align:right;font-weight:600;font-size:11px;">${fmt(cnt)}</td>
      <td style="padding:5px 10px;text-align:right;color:var(--text3);font-size:10px;">${pct(cnt,dmDials)}</td>

        <td style="padding:5px 10px;text-align:right;color:var(--text3);font-size:10px;">${pct(i+cb,s.dials)}</td>

function renderS3HTML(rows) {

    {key:'all', label:'All Sources'},

  const srcTabs = srcOptions.map(o=>
    `<button class="src-tab ${s3SrcFilter===o.key?'src-active':''}" onclick="setS3Filter('${o.key}')">${o.label}</button>`
  ).join('');
  const modeTabs = `
    <button class="src-tab ${s3Mode==='count'?'src-active':''}" onclick="setS3Mode('count')">Count</button>
    <button class="src-tab ${s3Mode==='amount'?'src-active':''}" onclick="setS3Mode('amount')">₹ Amount</button>`;
  return `

function setS3Filter(key) {
  s3SrcFilter = key;
  const rows = G.pipeline?.rows || [];
  const el = document.getElementById('view-main');
  if (el) {
    const s3el = document.getElementById('s3-content');
    if (s3el) s3el.innerHTML = buildS3Content(rows);
    // Update active tab styling
    document.querySelectorAll('.src-tab').forEach(b => {
      const onclick = b.getAttribute('onclick') || '';
      if (onclick.includes("setS3Filter")) b.className = 'src-tab' + (onclick.includes("'"+key+"'") ? ' src-active' : '');
    });
  }
}
function setS3Mode(mode) {
  s3Mode = mode;
  const rows = G.pipeline?.rows || [];
  const s3el = document.getElementById('s3-content');
  if (s3el) s3el.innerHTML = buildS3Content(rows);
  document.querySelectorAll('.src-tab').forEach(b => {
    const onclick = b.getAttribute('onclick') || '';
    if (onclick.includes("setS3Mode")) b.className = 'src-tab' + (onclick.includes("'"+mode+"'") ? ' src-active' : '');
  });
}

function buildS3Content(rows) {
  const filtered = s3SrcFilter==='all' ? rows :
    rows.filter(r=>(r.lead_source||'').toLowerCase()===s3SrcFilter);

  // Status summary
  const statusMap={};
  filtered.forEach(r=>{
    const s=r.status||'Unknown';
    if(!statusMap[s]) statusMap[s]={count:0,amount:0};
    statusMap[s].count++;
    statusMap[s].amount+=(r.expected_amount_cr||0);
  });
  const sOrder=['Disbursed','Sanctioned','Credit Review','Login','Login Pending','Hold','Case Dropped','Rejected'];
  const allStatuses=[...sOrder,...Object.keys(statusMap).filter(s=>!sOrder.includes(s))].filter(s=>statusMap[s]);
  const statusCards = allStatuses.map(s=>{
    const d=statusMap[s];
    const m=STATUS_META[s]||['#6b7280','#f3f4f6'];
    const val=s3Mode==='amount'?fmtAmt(d.amount):fmt(d.count);
    const sub=s3Mode==='amount'?`${d.count} entr${d.count===1?'y':'ies'}`:d.amount>0?fmtAmt(d.amount):'';
    return `<div class="mc" style="border-top-color:${m[0]};">
      <div class="mc-lbl">${s}</div>
      <div class="mc-val" style="color:${m[0]};font-size:22px;">${val}</div>
      ${sub?`<div class="mc-sub">${sub}</div>`:''}
    </div>`;
  }).join('');

  // Officer summary
  const offMap={};
  filtered.forEach(r=>{const o=r.officer||'Unknown';if(!offMap[o])offMap[o]={count:0,amount:0,statuses:{},amounts:{}};offMap[o].count++;offMap[o].amount+=(r.expected_amount_cr||0);offMap[o].statuses[r.status]=(offMap[o].statuses[r.status]||0)+1;offMap[o].amounts[r.status]=(offMap[o].amounts[r.status]||0)+(r.expected_amount_cr||0);});
  const offRows = Object.entries(offMap).sort(([,a],[,b])=>b.count-a.count).map(([o,d])=>{
    const dis=d.statuses['Disbursed']||0, san=d.statuses['Sanctioned']||0;
    const disAmt=d.amounts['Disbursed']||0, sanAmt=d.amounts['Sanctioned']||0;
    const actCount=['Login Pending','Login','Hold','Credit Review'].reduce((s,k)=>s+(d.statuses[k]||0),0);
    const actAmt=['Login Pending','Login','Hold','Credit Review'].reduce((s,k)=>s+(d.amounts[k]||0),0);
    const othCount=d.count-dis-san-actCount;
    const othAmt=d.amount-disAmt-sanAmt-actAmt;
    return `<tr style="border-bottom:1px solid var(--border);">
      <td style="padding:7px 12px;font-weight:500;">${o}</td>
      <td style="padding:7px 12px;text-align:right;">${fmt(d.count)}${d.amount>0?' <span style=\"font-size:10px;color:var(--text3);\">' + fmtAmt(d.amount) + '</span>':''}</td>
      <td style="padding:7px 12px;text-align:right;color:var(--emerald);font-weight:600;">${dis}${disAmt>0?' <span style=\"font-size:10px;color:var(--emerald);opacity:0.7;\">' + fmtAmt(disAmt) + '</span>':''}</td>
      <td style="padding:7px 12px;text-align:right;color:var(--indigo);font-weight:600;">${san}${sanAmt>0?' <span style=\"font-size:10px;color:var(--indigo);opacity:0.7;\">' + fmtAmt(sanAmt) + '</span>':''}</td>
      <td style="padding:7px 12px;text-align:right;color:var(--amber);font-weight:500;">${actCount}${actAmt>0?' <span style=\"font-size:10px;color:var(--amber);opacity:0.8;\">' + fmtAmt(actAmt) + '</span>':''}</td>
      <td style="padding:7px 12px;text-align:right;color:var(--text3);font-size:11px;">${othCount}${othAmt>0?' '+fmtAmt(othAmt):''}</td>
    </tr>`;}).join('');

  // Lender summary
  const lndMap={};
  filtered.forEach(r=>{const l=r.lender||'TBD';if(!lndMap[l])lndMap[l]={count:0,amount:0,statuses:{},amounts:{}};lndMap[l].count++;lndMap[l].amount+=(r.expected_amount_cr||0);lndMap[l].statuses[r.status]=(lndMap[l].statuses[r.status]||0)+1;lndMap[l].amounts[r.status]=(lndMap[l].amounts[r.status]||0)+(r.expected_amount_cr||0);});
  const lndRows = Object.entries(lndMap).sort(([,a],[,b])=>b.count-a.count).map(([l,d])=>{
    const dis=d.statuses['Disbursed']||0, san=d.statuses['Sanctioned']||0;

    return `<tr style="border-bottom:1px solid var(--border);">
      <td style="padding:7px 12px;font-weight:500;">${l}</td>

      <td style="padding:7px 12px;text-align:right;color:var(--amber);font-weight:500;">${actCount}${actAmt>0?' <span style=\"font-size:10px;color:var(--amber);opacity:0.8;\">' + fmtAmt(actAmt) + '</span>':''}</td>
      <td style="padding:7px 12px;text-align:right;color:var(--text3);font-size:11px;">${othCount}${othAmt>0?' '+fmtAmt(othAmt):''}</td>
    </tr>`;}).join('');

  // Borrower grouping
  const borMap={}, borOrder=[];
  filtered.forEach(r=>{

  const borRows = borOrder.map((b,idx)=>{
    const att=borMap[b];
    const latSt=att[att.length-1].status;
    const totAmt=att.reduce((s,r)=>s+(r.expected_amount_cr||0),0);
    const sid='bor_'+idx;
    const lDetails=att.map(a=>`
      <tr style="border-bottom:1px solid var(--border);background:var(--bg);">
        <td style="padding:6px 16px 6px 28px;font-size:11px;color:var(--text2);">${a.lender||'TBD'}</td>
        <td style="padding:6px 12px;">${statusBadge(a.status)}</td>
        <td style="padding:6px 12px;font-size:11px;color:var(--text3);">${a.officer||'—'}</td>
        <td style="padding:6px 12px;text-align:right;font-size:11px;">${a.expected_amount_cr>0?fmtAmt(a.expected_amount_cr):'—'}</td>

    return `

        <td style="padding:8px 12px;font-size:11px;color:var(--text3);">${att[0].officer||'—'}</td>
        <td style="padding:8px 12px;text-align:right;font-size:11px;">${totAmt>0?fmtAmt(totAmt):'—'}</td>
        <td style="padding:8px 12px;font-size:11px;color:var(--indigo);text-align:center;">${att.length} lender${att.length>1?'s':''} ▾</td>
      </tr>
      <tr id="${sid}" style="display:none;">
        <td colspan="6" style="padding:0;">
          <table style="width:100%;border-collapse:collapse;font-size:11px;">
            <thead><tr style="background:var(--bg3);">
              <th class="th-cell" style="text-align:left;padding-left:28px;">Lender</th>
              <th class="th-cell" style="text-align:left;">Status</th>
              <th class="th-cell" style="text-align:left;">Officer</th>
              ${thCell('Amount')}<th class="th-cell" style="text-align:left;">Login Date</th>

  const tableHdr = `<thead><tr>
    <th class="th-cell" style="text-align:left;">Borrower</th>
    <th class="th-cell" style="text-align:left;">Latest Status</th>
    <th class="th-cell" style="text-align:left;">Lead Source</th>
    <th class="th-cell" style="text-align:left;">Officer</th>
    ${thCell('Amount')}

  </tr></thead>`;

  return `
    <div class="metric-grid" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr));margin-bottom:16px;">${statusCards}</div>
    <div class="two-col" style="margin-bottom:14px;">
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;">
        <div style="padding:9px 12px;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;background:var(--bg3);border-bottom:1px solid var(--border);">Officer Summary</div>

// ── CONVERSION CHAIN ──
function renderChain(a, h, blended, dm, rows, totalUnique, manUnique, handoffUnique) {
  if (!a) return '';

  const aiInt  = a.dispositions?.['INTERESTED']?.dials||0;
  const aiCB   = a.dispositions?.['CALL BACK']?.dials||0;
  const aiProd = aiInt + aiCB;
  const handoff= handoffUnique || (h ? (h.interested||0)+(h.callback||0) : 0);

  const bDials = blended?.total_dials||0;
  const bConn  = blended?.connected||0;
  const bInt   = blended?.dispositions?.['Interested']||0;
  const bCB    = blended?.dispositions?.['Call Back']||blended?.dispositions?.['CALL BACK']||0;
  const bProd  = bInt + bCB;

  const dmDials= dm?.total_dials||0, dmConn = dm?.connected||0;
  const dmInt  = dm?.dispositions?.['Interested']||0;
  const dmCB   = dm?.dispositions?.['Call Back']||0;
  const dmProd = dmInt + dmCB;

  const byStatus={}, byAmt={};
  rows.forEach(r=>{byStatus[r.status]=(byStatus[r.status]||0)+1;byAmt[r.status]=(byAmt[r.status]||0)+(r.expected_amount_cr||0);});
  const lPend=byStatus['Login Pending']||0, lPendA=byAmt['Login Pending']||0;
  const login=byStatus['Login']||0, loginA=byAmt['Login']||0;
  const crRev=(byStatus['Credit Review']||0)+(byStatus['Hold']||0), crRevA=(byAmt['Credit Review']||0)+(byAmt['Hold']||0);
  const san=byStatus['Sanctioned']||0, sanA=byAmt['Sanctioned']||0;
  const disb=byStatus['Disbursed']||0, disbA=byAmt['Disbursed']||0;
  const rej=byStatus['Rejected']||0, rejA=byAmt['Rejected']||0;
  const drop=byStatus['Case Dropped']||0, dropA=byAmt['Case Dropped']||0;
  const total=rows.length, totalAmt=rows.reduce((s,r)=>s+(r.expected_amount_cr||0),0);

  const cc = v => v>=30?'#3B6D11':v>=10?'#854F0B':'#A32D2D';

  function node(label, val, cls, sub) {
    return '<div class="cn cn-'+cls+'">'
      +'<div class="cn-lbl">'+label+'</div>'
      +'<div class="cn-val">'+fmt(val)+'</div>'
      +(sub?'<div class="cn-sub">'+sub+'</div>':'')
      +'</div>';
  }
  function arr(pct) {
    const col = pct!==undefined ? cc(pct) : 'var(--text3)';
    const pctStr = pct!==undefined ? '<div style="font-size:9px;font-weight:500;color:'+col+';margin-bottom:1px;">'+fmtD(pct)+'</div>' : '<div style="height:13px;"></div>';
    return '<div class="cn-arr">'+pctStr+'<div style="font-size:11px;color:var(--text3);">→</div></div>';
  }

  const aiRow = '<div class="chain-stream">'
    +'<div class="stream-tag st-ai">AI Flow</div>'
    +node('Unique', totalUnique, 'ai')
    +arr()
    +node('Dials', a.total_dials, 'ai', fmtD(a.total_dials/Math.max(totalUnique,1))+'/ lead')
    +arr(pctN(a.connected, a.total_dials))
    +node('Connected', a.connected, 'tl')
    +arr(pctN(aiProd, a.connected))
    +node('Productive', aiProd, 'vi', 'Int '+fmt(aiInt)+' · CB '+fmt(aiCB))
    +arr()
    +node('Handoff', handoff, 'em')
    +arr()
    +node('Tele Dials', bDials, 'em', fmtD(bDials/Math.max(handoff,1))+'/ lead')
    +arr(pctN(bConn,bDials))
    +node('Tele Conn.', bConn, 'em', pct(bConn,bDials)+' conn.')
    +arr(bProd>0?pctN(bProd,bConn):undefined)
    +node('Tele Prod.', bProd, 'em', 'Int '+fmt(bInt)+' · CB '+fmt(bCB))
    +'</div>';

  const teleRow = '<div class="chain-stream">'
    +'<div class="stream-tag st-tele">Direct Tele</div>'
    +node('Unique', manUnique||0, 'tl')
    +arr()
    +node('Dials', dmDials, 'tl', manUnique>0?fmtD(dmDials/manUnique)+'/ lead':'')
    +arr(pctN(dmConn, dmDials))
    +node('Connected', dmConn, 'tl')
    +arr(pctN(dmProd, dmConn))
    +node('Productive', dmProd, 'em', 'Int '+fmt(dmInt)+' · CB '+fmt(dmCB))
    +'</div>';

  const pipeRow = '<div class="chain-stream">'
    +'<div class="stream-tag st-pipe">Pipeline</div>'
    +node('Total', total, 'am', fmtAmt(totalAmt))
    +arr(pctN(lPend+login+crRev+san+disb, total))
    +node('L.Pending', lPend, 'am', lPendA>0?fmtAmt(lPendA):'')
    +arr(pctN(login+crRev+san+disb, lPend+login+crRev+san+disb))
    +node('Login', login, 'am', loginA>0?fmtAmt(loginA):'')
    +arr(pctN(crRev+san+disb, login+crRev+san+disb))
    +node('Cr.Review', crRev, 'am', crRevA>0?fmtAmt(crRevA):'')
    +arr(pctN(san+disb, crRev+san+disb))
    +node('Sanctioned', san, 'co', sanA>0?fmtAmt(sanA):'')
    +arr(pctN(disb, san))
    +node('Disbursed', disb, 'pk', disbA>0?fmtAmt(disbA):'')
    +'<div style="width:0.5px;background:var(--border);margin:0 8px;align-self:stretch;flex-shrink:0;"></div>'
    +node('Rejected', rej, 'rd', rejA>0?fmtAmt(rejA):'')
    +node('Case Drop.', drop, 'rd', dropA>0?fmtAmt(dropA):'')
    +'</div>';

  return '<div class="conv-chain">'
    +'<div class="conv-chain-title">End-to-end conversion chain</div>'
    +aiRow
    +teleRow
    +'<div style="border-top:0.5px dashed var(--border);margin:8px 0;"></div>'
    +pipeRow
    +'</div>';
}







// ── DAY-WISE VIEW ──
function renderDaywise() {
  const aiDays = G.ai?.allDays || [];
  const hDays  = G.handoff?.allDays || [];
  const bDays  = G.dialerBlended?.allDays || [];
  const dmDays = G.dialerManual?.allDays || [];
  const el     = document.getElementById('view-daywise');

  if (!aiDays.length && !hDays.length && !dmDays.length) {
    el.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text3);">No day data available</div>';
    return;
  }

  const aiMap={}, hMap={}, bMap={}, dmMap={};
  aiDays.forEach(d=>aiMap[d.label]=d);
  hDays.forEach(d=>hMap[d.label]=d);
  bDays.forEach(d=>bMap[d.label]=d);
  dmDays.forEach(d=>dmMap[d.label]=d);

  function parseD(s) {
    try { return new Date(s.replace(/(\d+)\s+(\w+)\s+(\d+)/,'$2 $1 $3')); }
    catch(e) { return new Date(0); }
  }

  const allLabels=[...new Set([...aiDays,...hDays,...bDays,...dmDays].map(d=>d.label))].sort((a,b)=>parseD(a)-parseD(b));

  // Group by month
  const monthMap={}, monthOrder=[];
  allLabels.forEach(lbl=>{
    const parts=lbl.split(' ');
    const mKey=parts.length>=3?parts[1]+' '+parts[2]:'Other';
    if(!monthMap[mKey]){monthMap[mKey]=[];monthOrder.push(mKey);}
    monthMap[mKey].push(lbl);
  });

  function weekNum(lbl) {
    const d=parseInt(lbl.split(' ')[0])||1;
    return 'Week '+Math.ceil(d/7);
  }

  function buildDayRow(lbl, isTotal=false) {
    const ai=aiMap[lbl]||{}, h=hMap[lbl]||{}, b=bMap[lbl]||{}, dm=dmMap[lbl]||{};
    const prod=(ai.dispositions?.['INTERESTED']?.dials||0)+(ai.dispositions?.['CALL BACK']?.dials||0);
    const bInt=b.dispositions?.['Interested']||0, bCB=b.dispositions?.['Call Back']||b.dispositions?.['CALL BACK']||0;
    const dmInt=dm.dispositions?.['Interested']||0, dmCB=dm.dispositions?.['Call Back']||0;
    const cls = isTotal ? 'dw-total-row' : '';
    const display = isTotal ? lbl : lbl.split(' ')[0]+' '+lbl.split(' ')[1];
    return `<tr class="${cls}">
      <td>${display}</td>
      <td>${ai.unique_leads!=null?fmt(ai.unique_leads):'—'}</td>
      <td>${ai.total_dials!=null?fmt(ai.total_dials):'—'}</td>
      <td>${ai.connected!=null?fmt(ai.connected):'—'}</td>
      <td style="color:var(--text3);font-size:10px;">${ai.total_dials?pct(ai.connected,ai.total_dials):'—'}</td>
      <td>${prod?fmt(prod):'—'}</td>
      <td style="color:var(--text3);font-size:10px;">${ai.connected?pct(prod,ai.connected):'—'}</td>
      <td style="border-left:2px solid var(--indigo);">${b.unique_leads!=null?fmt(b.unique_leads):'—'}</td>
      <td>${b.total_dials!=null?fmt(b.total_dials):'—'}</td>
      <td>${b.connected!=null?fmt(b.connected):'—'}</td>
      <td style="color:var(--emerald);font-size:11px;">${bInt?fmt(bInt):'—'}</td>
      <td style="color:var(--violet);font-size:11px;">${bCB?fmt(bCB):'—'}</td>
      <td style="border-left:2px solid var(--teal);">${dm.unique_leads!=null?fmt(dm.unique_leads):'—'}</td>
      <td>${dm.total_dials!=null?fmt(dm.total_dials):'—'}</td>
      <td>${dm.connected!=null?fmt(dm.connected):'—'}</td>
      <td style="color:var(--emerald);font-size:11px;">${dmInt?fmt(dmInt):'—'}</td>
      <td style="color:var(--violet);font-size:11px;">${dmCB?fmt(dmCB):'—'}</td>
    </tr>`;
  }

  function sumLabels(labels) {
    const r={unique_leads:0,total_dials:0,connected:0,prod:0,b_uniq:0,b_dials:0,b_conn:0,b_int:0,b_cb:0,dm_uniq:0,dm_dials:0,dm_conn:0,dm_int:0,dm_cb:0};
    labels.forEach(lbl=>{
      const ai=aiMap[lbl]||{}, b=bMap[lbl]||{}, dm=dmMap[lbl]||{};
      r.unique_leads+=(ai.unique_leads||0);
      r.total_dials+=(ai.total_dials||0);
      r.connected+=(ai.connected||0);
      r.prod+=((ai.dispositions?.['INTERESTED']?.dials||0)+(ai.dispositions?.['CALL BACK']?.dials||0));
      r.b_uniq+=(b.unique_leads||0);
      r.b_dials+=(b.total_dials||0);
      r.b_conn+=(b.connected||0);
      r.b_int+=((b.dispositions?.['Interested']||0));
      r.b_cb+=((b.dispositions?.['Call Back']||b.dispositions?.['CALL BACK']||0));
      r.dm_uniq+=(dm.unique_leads||0);
      r.dm_dials+=(dm.total_dials||0);
      r.dm_conn+=(dm.connected||0);
      r.dm_int+=((dm.dispositions?.['Interested']||0));
      r.dm_cb+=((dm.dispositions?.['Call Back']||0));
    });
    return r;
  }

  const tableHead = `<thead>
    <tr class="dw-section-hdr"><td colspan="7">Stage 1 — AI Auto-Calling</td><td colspan="5">Stage 2A — AI Handoff Tele</td><td colspan="5">Stage 2B — Direct Tele</td></tr>
    <tr>
      <th class="th-cell" style="text-align:left;font-size:9px;">Date</th>
      <th class="th-cell" style="font-size:9px;">Unique</th><th class="th-cell" style="font-size:9px;">Dials</th>
      <th class="th-cell" style="font-size:9px;">Conn.</th><th class="th-cell" style="font-size:9px;">Conn%</th>
      <th class="th-cell" style="font-size:9px;">Prod.</th><th class="th-cell" style="font-size:9px;">Prod%</th>
      <th class="th-cell" style="font-size:9px;border-left:2px solid var(--indigo);">Unique</th><th class="th-cell" style="font-size:9px;">Dials</th><th class="th-cell" style="font-size:9px;">Conn.</th><th class="th-cell" style="font-size:9px;color:var(--emerald);">Int.</th><th class="th-cell" style="font-size:9px;color:var(--violet);">CB</th>
      <th class="th-cell" style="font-size:9px;border-left:2px solid var(--teal);">Unique</th><th class="th-cell" style="font-size:9px;">Dials</th><th class="th-cell" style="font-size:9px;">Conn.</th><th class="th-cell" style="font-size:9px;color:var(--emerald);">Int.</th><th class="th-cell" style="font-size:9px;color:var(--violet);">CB</th>
    </tr>
  </thead>`;

  function buildMonthContent(mKey) {
    const labels=monthMap[mKey];
    const weekMap={}, weekOrder=[];
    labels.forEach(lbl=>{const w=weekNum(lbl);if(!weekMap[w]){weekMap[w]=[];weekOrder.push(w);}weekMap[w].push(lbl);});

    const mTot=sumLabels(labels);
    const weekSections = weekOrder.map(wk=>{
      const wLabels=weekMap[wk];
      const wid='wk_'+mKey.replace(/\s/g,'_')+'_'+wk.replace(/\s/g,'_');
      const dayRows=wLabels.map(l=>buildDayRow(l)).join('');
      const wTot=sumLabels(wLabels);
      return `
        <tr class="dw-week-hdr" onclick="toggleM('${wid}')">
          <td colspan="17" style="padding:6px 12px;">📋 ${wk} &nbsp;<span style="font-weight:400;color:var(--text3);">(${wLabels.length} day${wLabels.length>1?'s':''})</span>
            <span id="${wid}_c" style="float:right;transition:transform 0.2s;">▾</span>
          </td>
        </tr>
        <tr id="${wid}_body" style="display:none;"><td colspan="17" style="padding:0;">
          <table style="width:100%;border-collapse:collapse;font-size:11px;">
            <tbody>${dayRows}</tbody>
          </table>
        </td></tr>`;
    }).join('');

    const totRow=`<tr class="dw-total-row">
      <td>${mKey} Total</td>
      <td>${fmt(G.totalUniqueLeads||0)}</td><td>${fmt(mTot.total_dials)}</td>
      <td>${fmt(mTot.connected)}</td><td>${pct(mTot.connected,mTot.total_dials)}</td>
      <td>${fmt(mTot.prod)}</td><td>${pct(mTot.prod,mTot.connected)}</td>
      <td style="border-left:2px solid var(--indigo);">${fmt(G.totalBlenUnique||0)}</td><td>${fmt(mTot.b_dials)}</td><td>${fmt(mTot.b_conn)}</td>
      <td style="color:var(--emerald);">${fmt(mTot.b_int)}</td><td style="color:var(--violet);">${fmt(mTot.b_cb)}</td>
      <td style="border-left:2px solid var(--teal);">${fmt(G.totalManualUnique||0)}</td><td>${fmt(mTot.dm_dials)}</td><td>${fmt(mTot.dm_conn)}</td>
      <td style="color:var(--emerald);">${fmt(mTot.dm_int)}</td><td style="color:var(--violet);">${fmt(mTot.dm_cb)}</td>
    </tr>`;
    return weekSections + totRow;
  }

  const allTot=sumLabels(allLabels);
  const firstMth=monthOrder[0];
  const tabsHtml=monthOrder.map((mk,i)=>
    `<button class="dw-tab ${i===0?'dw-tab-active':''}" onclick="switchDwTab('${mk.replace(/\s/g,'_')}',this)">${mk}</button>`
  ).join('')+`<button class="dw-tab" onclick="switchDwTab('__yearly',this)">📆 Yearly</button>`;

  const monthPanels=monthOrder.map((mk,i)=>`
    <div class="dw-panel ${i===0?'dw-panel-active':''}" id="dwp_${mk.replace(/\s/g,'_')}">
      <div style="overflow-x:auto;">
        <table class="dw-table">${tableHead}<tbody>${buildMonthContent(mk)}</tbody></table>
      </div>
    </div>`).join('');

  const yearPanel=`<div class="dw-panel" id="dwp___yearly">
    <div style="overflow-x:auto;">
      <table class="dw-table">${tableHead}<tbody>
        <tr class="dw-total-row">
          <td>Yearly Total</td>
          <td>${fmt(G.totalUniqueLeads||0)}</td><td>${fmt(allTot.total_dials)}</td>
          <td>${fmt(allTot.connected)}</td><td>${pct(allTot.connected,allTot.total_dials)}</td>
          <td>${fmt(allTot.prod)}</td><td>${pct(allTot.prod,allTot.connected)}</td>
          <td style="border-left:2px solid var(--indigo);">${fmt(G.totalBlenUnique||0)}</td><td>${fmt(allTot.b_dials)}</td><td>${fmt(allTot.b_conn)}</td>
          <td style="color:var(--emerald);">${fmt(allTot.b_int)}</td><td style="color:var(--violet);">${fmt(allTot.b_cb)}</td>
          <td style="border-left:2px solid var(--teal);">${fmt(G.totalManualUnique||0)}</td><td>${fmt(allTot.dm_dials)}</td><td>${fmt(allTot.dm_conn)}</td>
          <td style="color:var(--emerald);">${fmt(allTot.dm_int)}</td><td style="color:var(--violet);">${fmt(allTot.dm_cb)}</td>
        </tr>
      </tbody></table>
    </div>
  </div>`;

  el.innerHTML=`
    <div style="margin-bottom:20px;">
      <div style="font-size:20px;font-weight:300;color:var(--text);letter-spacing:-0.3px;margin-bottom:6px;"><strong>Day-wise</strong> View</div>
      <div style="font-size:12px;color:var(--text3);">Click month tab → expand week → see daily breakdown</div>
    </div>
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);">
      <div class="dw-tabs">${tabsHtml}</div>
      <div class="dw-panels">${monthPanels}${yearPanel}</div>
    </div>
    <div class="dash-footer">
      <span>CarmaOne — AI Sales Tele Calling MIS &nbsp;·&nbsp; Confidential</span>
      <span>Generated ${new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}</span>
    </div>`;
}

function switchDwTab(key, btn) {
  document.querySelectorAll('.dw-tab').forEach(t=>t.classList.remove('dw-tab-active'));
  document.querySelectorAll('.dw-panel').forEach(p=>p.classList.remove('dw-panel-active'));
  btn.classList.add('dw-tab-active');
  const p=document.getElementById('dwp_'+key);
  if(p) p.classList.add('dw-panel-active');
}

function toggleM(id) {
  const b=document.getElementById(id+'_body'), c=document.getElementById(id+'_c');
  if(!b||!c) return;
  const open=b.style.display!=='none';
  b.style.display=open?'none':'table-row';
  c.style.transform=open?'':'rotate(180deg)';
}

// ── AUDIT TRAIL ──
async function loadAudit() {
  if(auditLoaded) return;
  const el=document.getElementById('view-audit');
  el.innerHTML='<div style="padding:40px;text-align:center;color:var(--text3);">Loading audit trail...</div>';
  try {
    const res=await fetch('https://mis-backend-python.onrender.com/audit?t='+Date.now());
    const log=await res.json();
    renderAudit(log);
    auditLoaded=true;
  } catch(e) {
    el.innerHTML='<div style="padding:40px;text-align:center;color:var(--rose);">Could not load audit trail. <span style="cursor:pointer;color:var(--indigo);" onclick="auditLoaded=false;loadAudit()">Retry</span></div>';
  }
}

function renderAudit(log) {
  const el=document.getElementById('view-audit');
  if(!log||!log.length){el.innerHTML='<div style="padding:40px;text-align:center;color:var(--text3);">No audit records yet.</div>';return;}
  const rows=log.map(entry=>{
    const isOk=entry.status==='SUCCESS';
    const badge=isOk
      ?`<span style="background:#dcf5ed;color:#059669;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:600;">✓ Success</span>`
      :`<span style="background:#fde8ee;color:#e11d48;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:600;">✗ Rejected</span>`;
    const changes=entry.changes?Object.entries(entry.changes).map(([k,v])=>`<div style="font-size:11px;color:var(--text2);padding:2px 0;border-bottom:1px solid var(--border);">🔹 <b>${k}</b>: ${v}</div>`).join(''):'';
    const errors=(entry.errors||[]).map(e=>`<div style="font-size:11px;color:var(--rose);padding:2px 0;">${e}</div>`).join('');
    const warns=(entry.warnings||[]).map(w=>`<div style="font-size:11px;color:var(--amber);padding:2px 0;">${w}</div>`).join('');
    return `<tr>
      <td style="padding:10px 14px;vertical-align:top;white-space:nowrap;font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--text2);">${entry.ts||'—'}</td>
      <td style="padding:10px 14px;vertical-align:top;font-size:13px;font-weight:600;white-space:nowrap;">${entry.by||'—'}</td>
      <td style="padding:10px 14px;vertical-align:top;">${badge}</td>
      <td style="padding:10px 14px;vertical-align:top;min-width:320px;">${changes||errors||'<span style="font-size:11px;color:var(--text3);">—</span>'}${warns?`<div style="margin-top:4px;color:var(--amber);font-size:10px;">Warnings: ${warns}</div>`:''}</td>
    </tr>`;
  }).join('');
  el.innerHTML=`
    <div style="margin-bottom:20px;">
      <div style="font-size:20px;font-weight:300;color:var(--text);letter-spacing:-0.3px;margin-bottom:6px;"><strong>Audit</strong> Trail</div>
      <div style="font-size:12px;color:var(--text3);">All upload activity — who uploaded, when, what changed</div>
    </div>
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);">
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;">
          <thead><tr style="background:var(--bg3);">
            ${thCell('Timestamp (IST)','left')}${thCell('Uploaded By','left')}${thCell('Status','left')}${thCell('Details','left')}
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
    <div style="margin-top:10px;font-size:11px;color:var(--text3);text-align:right;">
      Showing last ${log.length} records &nbsp;·&nbsp;
      <span style="cursor:pointer;color:var(--indigo);" onclick="auditLoaded=false;loadAudit()">↺ Refresh</span>
    </div>
    <div class="dash-footer">
      <span>CarmaOne — AI Sales Tele Calling MIS &nbsp;·&nbsp; Confidential</span>
      <span>Generated ${new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}</span>
    </div>`;
}

function switchView(v,btn){
  document.querySelectorAll('.view-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.view-panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('view-'+v).classList.add('active');
}
</script>
